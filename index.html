<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graficador de Funciones Polinómicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col items-center py-12 px-4">

    <div class="w-full max-w-4xl bg-white shadow-xl rounded-2xl overflow-hidden">
        <!-- Encabezado -->
        <div class="bg-indigo-600 px-8 py-6 text-white">
            <h1 class="text-3xl font-bold">Análisis Matemático</h1>
            <p class="text-indigo-200 mt-2">Graficador, raíces y tabla de Bolzano</p>
        </div>

        <!-- Selector de Pestañas -->
        <div class="flex border-b border-slate-200 text-sm font-medium text-slate-500">
            <button type="button" onclick="setMode('canonica')" id="tab-canonica" class="flex-1 py-4 text-center text-indigo-600 border-b-2 border-indigo-600 focus:outline-none transition-colors cursor-pointer">
                Ingresar Función Canónica
            </button>
            <button type="button" onclick="setMode('coeficientes')" id="tab-coeficientes" class="flex-1 py-4 text-center hover:text-slate-700 border-b-2 border-transparent text-slate-500 focus:outline-none transition-colors cursor-pointer">
                Ingresar por Coeficientes
            </button>
        </div>

        <!-- Formularios -->
        <div class="p-8">
            
            <!-- Modo 1: Canónica (Le quitamos la clase "block" que causaba conflicto) -->
            <div id="modo-canonica">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Ingresa la función (Ej: x**3 - 2*x**2 + 4)</label>
                <input type="text" id="funcInput" placeholder="x**2 - 4" 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono">
            </div>

            <!-- Modo 2: Coeficientes -->
            <div id="modo-coeficientes" class="hidden">
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Grado del Polinomio</label>
                    <input type="number" id="degreeInput" value="2" min="1" max="10" oninput="generarInputsCoeficientes()"
                        class="w-32 px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono">
                </div>
                
                <label class="block text-sm font-semibold text-slate-700 mb-2 mt-4">Ingresa los coeficientes</label>
                <div id="coefContainer" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <!-- Se generan dinámicamente con JS -->
                </div>
            </div>

            <div class="mt-6 flex justify-end">
                <button type="button" onclick="analizar()" id="submitBtn"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-lg shadow-sm transition-all flex items-center justify-center min-w-[160px] w-full md:w-auto cursor-pointer">
                    Analizar Función
                </button>
            </div>
            
        </div>

        <!-- Estado de Error -->
        <div id="errorBox" class="hidden mx-8 mb-8 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-r-lg text-sm font-medium"></div>

        <!-- Resultados -->
        <div id="resultContainer" class="hidden border-t border-slate-100 p-8 flex flex-col items-center bg-slate-50/50">
            <h2 class="text-xl font-bold text-slate-700 mb-2 w-full text-left">Resultado del Análisis</h2>
            <p id="funParseada" class="text-sm font-mono text-slate-500 mb-6 w-full text-left bg-slate-100 p-2 rounded hidden"></p>
            <img id="resultImg" src="" alt="Gráfico generado" class="max-w-full h-auto rounded-xl shadow-sm border border-slate-200">
        </div>
    </div>

    <script>
        let currentMode = 'canonica';

        // Lógica súper explícita para cambiar de pestañas sin fallos
        function setMode(mode) {
            currentMode = mode;
            
            const tabCanonica = document.getElementById('tab-canonica');
            const tabCoeficientes = document.getElementById('tab-coeficientes');
            const formCanonica = document.getElementById('modo-canonica');
            const formCoeficientes = document.getElementById('modo-coeficientes');

            if (mode === 'canonica') {
                // Pintar pestaña activa
                tabCanonica.className = "flex-1 py-4 text-center text-indigo-600 border-b-2 border-indigo-600 focus:outline-none transition-colors cursor-pointer";
                tabCoeficientes.className = "flex-1 py-4 text-center hover:text-slate-700 border-b-2 border-transparent text-slate-500 focus:outline-none transition-colors cursor-pointer";
                
                // Mostrar/Ocultar
                formCanonica.classList.remove('hidden');
                formCoeficientes.classList.add('hidden');
            } else {
                // Pintar pestaña activa
                tabCanonica.className = "flex-1 py-4 text-center hover:text-slate-700 border-b-2 border-transparent text-slate-500 focus:outline-none transition-colors cursor-pointer";
                tabCoeficientes.className = "flex-1 py-4 text-center text-indigo-600 border-b-2 border-indigo-600 focus:outline-none transition-colors cursor-pointer";
                
                // Mostrar/Ocultar
                formCanonica.classList.add('hidden');
                formCoeficientes.classList.remove('hidden');
            }
        }

        function generarInputsCoeficientes() {
            const degree = parseInt(document.getElementById('degreeInput').value) || 2;
            const container = document.getElementById('coefContainer');
            container.innerHTML = '';
            
            for(let i = degree; i >= 0; i--) {
                const label = i === 0 ? 'Térm. Independiente' : `Coeficiente x^${i}`;
                container.innerHTML += `
                    <div class="flex flex-col bg-white p-3 border border-slate-100 rounded-lg shadow-sm">
                        <label class="text-xs font-semibold text-slate-500 mb-2 truncate">${label}</label>
                        <input type="text" id="coef_${i}" placeholder="0" 
                            class="px-3 py-2 bg-slate-50 border border-slate-200 rounded text-center focus:outline-none focus:ring-2 focus:ring-indigo-400 font-mono">
                    </div>
                `;
            }
        }

        // Inicializar los casilleros de grado al cargar la página
        generarInputsCoeficientes();

        async function analizar() {
            let funcString = "";
            const btn = document.getElementById('submitBtn');
            const resultContainer = document.getElementById('resultContainer');
            const resultImg = document.getElementById('resultImg');
            const errorBox = document.getElementById('errorBox');
            const funParseada = document.getElementById('funParseada');

            // Recolectar la información según la pestaña activa
            if (currentMode === 'canonica') {
                funcString = document.getElementById('funcInput').value;
            } else {
                const degree = parseInt(document.getElementById('degreeInput').value) || 2;
                let terms = [];
                for(let i = degree; i >= 0; i--) {
                    let val = document.getElementById(`coef_${i}`).value.trim(); 
                    if(val === "") val = "0"; // Si lo dejan vacío, es 0
                    terms.push(`(${val})*x**${i}`);
                }
                funcString = terms.join(" + ");
            }

            if (!funcString.trim()) return;

            // UI Cargando
            btn.innerHTML = '<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
            btn.disabled = true;
            errorBox.classList.add('hidden');
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ function: funcString })
                });

                const data = await response.json();

                if (data.success) {
                    resultImg.src = data.image;
                    
                    if(currentMode === 'coeficientes') {
                        funParseada.textContent = "Expresión enviada al servidor: " + funcString;
                        funParseada.classList.remove('hidden');
                    } else {
                        funParseada.classList.add('hidden');
                    }
                    
                    resultContainer.classList.remove('hidden');
                } else {
                    errorBox.textContent = data.error;
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorBox.textContent = 'Error de conexión con el servidor.';
                errorBox.classList.remove('hidden');
            } finally {
                btn.innerHTML = 'Analizar Función';
                btn.disabled = false;
            }
        }

        // Permitir envío con "Enter" en el modo canónico
        document.getElementById('funcInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') analizar();
        });
    </script>
</body>
</html>
